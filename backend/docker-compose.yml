services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: where2watt-backend
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-where2watt}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN}
      - STRAVA_WEBHOOK_VERIFY_TOKEN=${STRAVA_WEBHOOK_VERIFY_TOKEN}
      - STRAVA_WEBHOOK_SECRET=${STRAVA_WEBHOOK_SECRET}
      - ADMIN_STRAVA_IDS=${ADMIN_STRAVA_IDS}
      - ADMIN_DISCORD_WEBHOOK_URL=${ADMIN_DISCORD_WEBHOOK_URL}
      # Add this to ensure Uvicorn runs correctly inside docker compose locally
      - PORT=8080
    ports:
      - "8080:8080"

  mongodb:
    # MongoDB 5+ requires ARMv8.2 instructions that older Raspberry Pi hosts lack.
    image: mongo:4.4.18
    container_name: where2watt-mongodb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand({ ping: 1 })"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DB_NAME:-where2watt_dev}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
