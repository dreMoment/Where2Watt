services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findmyintervals-backend
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-findmyintervals}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN}
      - ADMIN_STRAVA_IDS=${ADMIN_STRAVA_IDS}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Add this to ensure Uvicorn runs correctly inside docker compose locally
      - PORT=8080
    ports:
      - "8080:8080"

  mongodb:
    image: mongo:latest
    container_name: findmyintervals-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DB_NAME:-findmyintervals_dev}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
