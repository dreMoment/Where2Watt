services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findmyintervals-backend
    env_file:
      - .env
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-findmyintervals}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET}
      - STRAVA_REFRESH_TOKEN=${STRAVA_REFRESH_TOKEN}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - CORS_ORIGIN=${CORS_ORIGIN}
      # Add this to ensure Uvicorn runs correctly inside docker compose locally
      - PORT=8080
    ports:
      - "8080:8080"
